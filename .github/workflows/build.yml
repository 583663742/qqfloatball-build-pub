# QQFloatBall macOS 原生构建（TrollFools 注入路线，标准 CydiaSubstrate 依赖）
name: Build QQFloatBall

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install theos (roothide branch)
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"

      - name: Install iOS 16.5 SDK
        run: |
          mkdir -p "$THEOS/sdks"
          tar -xJf sdk/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"

      - name: Install ldid
        run: |
          brew install ldid || brew install --build-from-source ldid || (mkdir -p "$THEOS/bin" && curl -L -o "$THEOS/bin/ldid" https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64 && chmod +x "$THEOS/bin/ldid" && echo "$THEOS/bin" >> $GITHUB_PATH)

      - name: Verify Makefile
        run: |
          grep -n "LDFLAGS" Makefile || true
          grep -n "ARCHS" Makefile || true
          grep -n "THEOS_PACKAGE_SCHEME" Makefile || true

      - name: Build package - TrollFools standard substrate
        run: |
          # TrollFools 路线：不设 THEOS_PACKAGE_SCHEME=roothide！
          # roothide scheme 让依赖变成 @loader_path/.jbroot/usr/lib/libsubstrate.dylib
          # TrollFools 不建 .jbroot → dyld 加载闪退。标准 substrate 依赖才能被 ellekit 伪装版替代。
          make clean
          make package FINALPACKAGE=1

      - name: Verify dylib deps
        run: |
          DYLIB=$(find .theos/obj -name "QQFloatBall.dylib" -type f | head -1)
          echo "dylib: $DYLIB"
          otool -L "$DYLIB" || true

      - name: List artifacts
        run: |
          ls -la packages/ || true
          find . -name "*.deb" -not -path "./layout/*" | head -5

      - name: Upload deb plus dylib
        uses: actions/upload-artifact@v4
        with:
          name: qqfloatball-build
          path: |
            packages/*.deb
            .theos/obj/debug/*.dylib
            .theos/obj/debug/arm64/*.dylib
            .theos/obj/debug/arm64e/*.dylib
            .theos/obj/*.dylib
            .theos/obj/arm64/*.dylib
            .theos/obj/arm64e/*.dylib
          if-no-files-found: warn
